spring:
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hola_student_marketplace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:hsm}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope: openid,email,profile

app:
  session-secret: ${SESSION_SECRET:dev-only-change-this-session-secret}
  mail:
    from: ${MAIL_FROM:}
  mail-enabled: ${EMAIL_ENABLED:true}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

server:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  error:
    include-message: never
